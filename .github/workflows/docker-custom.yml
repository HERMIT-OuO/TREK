---
name: 构建个人版 Docker 镜像

# 手动选择分支发布，避免每次提交都构建镜像。
"on":
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 生成镜像地址
        id: meta
        shell: bash
        run: |
          # GHCR 镜像名称必须小写；使用完整提交 SHA 标记版本。
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="sha-${GITHUB_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            # 仅 main 分支更新 latest，避免其他分支覆盖日常部署版本。
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 启用 ARM64 模拟构建
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=docker-custom
          cache-to: type=gha,scope=docker-custom,mode=max

      - name: 输出镜像地址
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### 本次发布镜像" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r IMAGE_TAG; do
            echo "\`${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"
          echo "支持架构：linux/amd64、linux/arm64。" >> "$GITHUB_STEP_SUMMARY"
